# =====================================================
# CONFIGURACION ESPECIFICA DE DESARROLLO (Local)
# =====================================================

spring.application.name=MentorCore

# Conexion Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/mentorcore_dev?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Email
spring.mail.host=localhost
spring.mail.port=1025

# Logs
logging.level.com.mentorcore=DEBUG
