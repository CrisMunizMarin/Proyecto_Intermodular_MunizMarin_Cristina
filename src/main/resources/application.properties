# =====================================================
# MENTORCORE - Configuracion General
# Proyecto Intermodular 2o DAW - Cristina Muniz Marin
# =====================================================

spring.application.name=MentorCore
spring.profiles.active=dev

# Servidor y Codificacion
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Seguridad - Credenciales por defecto
spring.security.user.name=admin
spring.security.user.password=admin123

# Subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
mentorcore.uploads.ruta-base=src/main/resources/static/uploads

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
