<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | MentorCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">
</head>
<body>
<main class="mc-auth">
    <div class="container mc-auth__container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card mc-auth__card" aria-labelledby="reset-title">
                    <div class="mc-auth__body">
                        <header class="mc-auth__brand">
                            <div class="mb-3" aria-hidden="true">
                                <i class="fas fa-lock fa-3x" style="color: var(--mc-indigo);"></i>
                            </div>
                            <h1 id="reset-title" class="mc-auth__title mc-h1">Restablecer contraseña</h1>
                            <p class="mc-auth__subtitle">
                                Introduce tu nueva contraseña y confirma el cambio para volver a acceder a la plataforma.
                            </p>
                        </header>

                        <section th:if="${successMsg}" class="alert alert-success" aria-live="polite">
                            <p class="mb-0">
                                <i class="fas fa-check-circle me-2" aria-hidden="true"></i>
                                <span th:text="${successMsg}">Contraseña actualizada correctamente.</span>
                            </p>
                        </section>

                        <section th:if="${errorMsg}" class="alert alert-danger" aria-live="assertive">
                            <p class="mb-0">
                                <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>
                                <span th:text="${errorMsg}">Se ha producido un error.</span>
                            </p>
                        </section>

                        <form th:action="@{/auth/reset-password}" method="post" novalidate>
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <input type="hidden" name="token" th:value="${token}">

                            <fieldset class="border-0 p-0 m-0">
                                <legend class="visually-hidden">Formulario de nueva contraseña</legend>

                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-1" aria-hidden="true"></i>
                                        Nueva contraseña
                                    </label>
                                    <input type="password"
                                           id="password"
                                           name="password"
                                           class="form-control form-control-lg"
                                           autocomplete="new-password"
                                           placeholder="Introduce tu nueva contraseña"
                                           required>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmar" class="form-label">
                                        <i class="fas fa-check-double me-1" aria-hidden="true"></i>
                                        Confirmar contraseña
                                    </label>
                                    <input type="password"
                                           id="confirmar"
                                           name="confirmar"
                                           class="form-control form-control-lg"
                                           autocomplete="new-password"
                                           placeholder="Repite la contraseña"
                                           required>
                                </div>
                            </fieldset>

                            <div class="mc-auth__actions">
                                <button type="submit" class="btn btn-mc-primary btn-lg fw-bold">
                                    <i class="fas fa-save me-2" aria-hidden="true"></i>
                                    Guardar nueva contraseña
                                </button>

                                <p class="text-center mb-0">
                                    <a th:href="@{/auth/login}" class="mc-link">
                                        <i class="fas fa-arrow-left me-1" aria-hidden="true"></i>
                                        Volver al login
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>

                    <footer class="mc-auth__footer">
                        <p class="mb-0">CIFP La Laboral · Gijón · 2025-2026</p>
                    </footer>
                </section>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
