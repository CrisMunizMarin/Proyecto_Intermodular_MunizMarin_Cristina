<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | MentorCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">
</head>
<body style="background-color: #f0eef8;">

<div class="container">
    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x mb-3"
                           style="color: #432aa5;"></i>
                        <h4 class="fw-bold" style="color: #432aa5;">
                            Recuperar contraseña
                        </h4>
                        <p class="text-muted small">
                            Introduce tu email y te enviaremos un enlace
                            para restablecer tu contraseña.
                        </p>
                    </div>

                    <!-- MENSAJES -->
                    <div th:if="${successMsg}"
                         class="alert alert-success rounded-3" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMsg}"></span>
                    </div>

                    <div th:if="${errorMsg}"
                         class="alert alert-danger rounded-3" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${errorMsg}"></span>
                    </div>

                    <!-- FORMULARIO -->
                    <form th:action="@{/auth/recuperar-password}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">
                                <i class="fas fa-envelope me-1"
                                   style="color: #432aa5;"></i>
                                Email
                            </label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control form-control-lg rounded-3"
                                   placeholder="tu@email.com"
                                   required autofocus>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit"
                                    class="btn btn-lg rounded-3 fw-bold text-white"
                                    style="background-color: #432aa5;">
                                <i class="fas fa-paper-plane me-2"></i>
                                Enviar enlace
                            </button>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/auth/login}"
                               class="text-decoration-none small"
                               style="color: #329b9c;">
                                <i class="fas fa-arrow-left me-1"></i>
                                Volver al login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
