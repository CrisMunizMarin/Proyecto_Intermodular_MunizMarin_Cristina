<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | MentorCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">
</head>
<body>
<main class="mc-auth">
    <div class="container mc-auth__container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card mc-auth__card" aria-labelledby="recovery-title">
                    <div class="mc-auth__body">
                        <header class="mc-auth__brand">
                            <div class="mb-3" aria-hidden="true">
                                <i class="fas fa-key fa-3x" style="color: var(--mc-indigo);"></i>
                            </div>
                            <h1 id="recovery-title" class="mc-auth__title mc-h1">Recuperar contraseña</h1>
                            <p class="mc-auth__subtitle">
                                Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
                            </p>
                        </header>

                        <section th:if="${successMsg}" class="alert alert-success" aria-live="polite">
                            <p class="mb-0">
                                <i class="fas fa-check-circle me-2" aria-hidden="true"></i>
                                <span th:text="${successMsg}">Si el email existe, recibirás un enlace.</span>
                            </p>
                        </section>

                        <section th:if="${errorMsg}" class="alert alert-danger" aria-live="assertive">
                            <p class="mb-0">
                                <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>
                                <span th:text="${errorMsg}">Se ha producido un error.</span>
                            </p>
                        </section>

                        <form th:action="@{/auth/recuperar-password}" method="post" novalidate>
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <fieldset class="border-0 p-0 m-0">
                                <legend class="visually-hidden">Solicitud de recuperación de contraseña</legend>

                                <div class="mb-4">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-1" aria-hidden="true"></i>
                                        Correo electrónico
                                    </label>
                                    <input type="email"
                                           id="email"
                                           name="email"
                                           class="form-control form-control-lg"
                                           autocomplete="email"
                                           placeholder="tu@email.com"
                                           required>
                                </div>
                            </fieldset>

                            <div class="mc-auth__actions">
                                <button type="submit" class="btn btn-mc-primary btn-lg fw-bold">
                                    <i class="fas fa-paper-plane me-2" aria-hidden="true"></i>
                                    Enviar enlace
                                </button>

                                <p class="text-center mb-0">
                                    <a th:href="@{/auth/login}" class="mc-link">
                                        <i class="fas fa-arrow-left me-1" aria-hidden="true"></i>
                                        Volver al login
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>

                    <footer class="mc-auth__footer">
                        <p class="mb-0">CIFP La Laboral · Gijón · 2025-2026</p>
                    </footer>
                </section>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
