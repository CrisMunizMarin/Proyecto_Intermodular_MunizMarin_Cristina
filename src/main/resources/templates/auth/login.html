<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | MentorCore</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">
    <!-- CSS propio -->
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">
</head>
<body style="background-color: #f0eef8;">

<div class="container">
    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">
        <div class="col-md-5">

            <!-- TARJETA DE LOGIN -->
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">

                    <!-- LOGO Y TÍTULO -->
                    <div class="text-center mb-4">
						<img class="img" src="/img/MentorCore_circular.png">
                        <!--<i class="fas fa-graduation-cap fa-3x mb-3"
                           style="color: #432aa5;"></i>-->
                        <h2 class="fw-bold" style="color: #432aa5;">MentorCore</h2>
                        <p class="text-muted small">
                            Gestión de Formaciones en Empresa
                        </p>
                    </div>

                    <!-- MENSAJES DE ERROR / ÉXITO -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible
                         fade show rounded-3" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${logoutMsg}" class="alert alert-success alert-dismissible
                         fade show rounded-3" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${logoutMsg}"></span>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="alert"></button>
                    </div>

                    <!-- FORMULARIO DE LOGIN -->
                    <!-- Spring Security procesa este POST automáticamente -->
                    <form th:action="@{/auth/login}" method="post">

                        <!-- CSRF Token (obligatorio con Spring Security) -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <!-- USUARIO -->
                        <div class="mb-3">
                            <label for="nombreUsuario"
                                   class="form-label fw-semibold">
                                <i class="fas fa-user me-1"
                                   style="color: #432aa5;"></i>
                                Usuario
                            </label>
                            <input type="text"
                                   id="nombreUsuario"
                                   name="nombreUsuario"
                                   class="form-control form-control-lg rounded-3"
                                   placeholder="Introduce tu usuario"
                                   required
                                   autofocus>
                        </div>

                        <!-- CONTRASEÑA -->
                        <div class="mb-4">
                            <label for="password"
                                   class="form-label fw-semibold">
                                <i class="fas fa-lock me-1"
                                   style="color: #432aa5;"></i>
                                Contraseña
                            </label>
                            <div class="input-group">
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control form-control-lg rounded-start-3"
                                       placeholder="Introduce tu contraseña"
                                       required>
                                <!-- Botón mostrar/ocultar contraseña -->
                                <button type="button"
                                        class="btn btn-outline-secondary rounded-end-3"
                                        onclick="togglePassword()">
                                    <i class="fas fa-eye" id="iconoOjo"></i>
                                </button>
                            </div>
                        </div>

                        <!-- BOTÓN ACCEDER -->
                        <div class="d-grid mb-3">
                            <button type="submit"
                                    class="btn btn-lg rounded-3 fw-bold text-white"
                                    style="background-color: #432aa5;">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Acceder
                            </button>
                        </div>

                        <!-- ENLACE RECUPERAR CONTRASEÑA -->
                        <div class="text-center">
                            <a th:href="@{/auth/recuperar-password}"
                               class="text-decoration-none small"
                               style="color: #329b9c;">
                                <i class="fas fa-key me-1"></i>
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                    </form>
                </div>

                <!-- PIE DE TARJETA -->
                <div class="card-footer text-center text-muted small py-3"
                     style="background-color: #f8f7ff;">
                    CIFP La Laboral · Gijón · 2025-2026
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Mostrar / ocultar contraseña -->
<script>
    function togglePassword() {
        const campo = document.getElementById('password');
        const icono = document.getElementById('iconoOjo');
        if (campo.type === 'password') {
            campo.type = 'text';
            icono.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            campo.type = 'password';
            icono.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
</body>
</html>
