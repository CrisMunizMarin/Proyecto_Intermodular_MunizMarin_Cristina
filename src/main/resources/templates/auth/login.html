<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | MentorCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">
</head>
<body>
<main class="mc-auth">
    <div class="container mc-auth__container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card mc-auth__card" aria-labelledby="login-title">
                    <div class="mc-auth__body">
                        <header class="mc-auth__brand">
                            <img class="img"
                                 th:src="@{/img/MentorCore_circular.png}"
                                 src="/img/MentorCore_circular.png"
                                 alt="Logotipo de MentorCore">
                            <h1 id="login-title" class="mc-auth__title mc-h1">MentorCore</h1>
                            <p class="mc-auth__subtitle">
                                Gestión de Formaciones en Empresa
                            </p>
                        </header>

                        <section th:if="${errorMsg}" class="alert alert-danger" aria-live="assertive">
                            <p class="mb-0">
                                <i class="fas fa-exclamation-circle me-2" aria-hidden="true"></i>
                                <span th:text="${errorMsg}">Usuario o contraseña incorrectos.</span>
                            </p>
                        </section>

                        <section th:if="${logoutMsg}" class="alert alert-success" aria-live="polite">
                            <p class="mb-0">
                                <i class="fas fa-check-circle me-2" aria-hidden="true"></i>
                                <span th:text="${logoutMsg}">Has cerrado sesión correctamente.</span>
                            </p>
                        </section>

                        <form th:action="@{/auth/login}" method="post" novalidate>
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <fieldset class="border-0 p-0 m-0">
                                <legend class="visually-hidden">Acceso a la aplicación</legend>

                                <div class="mb-3">
                                    <label for="nombreUsuario" class="form-label">
                                        <i class="fas fa-user me-1" aria-hidden="true"></i>
                                        Usuario
                                    </label>
                                    <input type="text"
                                           id="nombreUsuario"
                                           name="nombreUsuario"
                                           class="form-control form-control-lg"
                                           autocomplete="username"
                                           placeholder="Introduce tu usuario"
                                           required>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-1" aria-hidden="true"></i>
                                        Contraseña
                                    </label>
                                    <div class="input-group">
                                        <input type="password"
                                               id="password"
                                               name="password"
                                               class="form-control form-control-lg"
                                               autocomplete="current-password"
                                               placeholder="Introduce tu contraseña"
                                               required>
                                        <button type="button"
                                                class="btn btn-outline-secondary"
                                                onclick="togglePassword()"
                                                aria-controls="password"
                                                aria-label="Mostrar u ocultar contraseña">
                                            <i class="fas fa-eye" id="iconoOjo" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="mc-auth__actions">
                                <button type="submit" class="btn btn-mc-primary btn-lg fw-bold">
                                    <i class="fas fa-sign-in-alt me-2" aria-hidden="true"></i>
                                    Acceder
                                </button>

                                <p class="text-center mb-0">
                                    <a th:href="@{/auth/recuperar-password}" class="mc-link">
                                        <i class="fas fa-key me-1" aria-hidden="true"></i>
                                        He olvidado mi contraseña
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>

                    <footer class="mc-auth__footer">
                        <p class="mb-0">CIFP La Laboral · Gijón · 2025-2026</p>
                    </footer>
                </section>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword() {
        const campo = document.getElementById('password');
        const icono = document.getElementById('iconoOjo');

        if (campo.type === 'password') {
            campo.type = 'text';
            icono.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            campo.type = 'password';
            icono.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
</body>
</html>
