<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
        'Asignaciones Tutor Centro',
        ~{layout/sidebar-tutor-centro :: sidebar},
        ~{::contenido},
        null,
        null
      )}">
<section th:fragment="contenido">
    <header class="mb-4">
        <p class="mc-caption text-uppercase fw-bold mb-2" style="color: var(--mc-indigo); letter-spacing: 0.08em;">
            Gestión de asignaciones
        </p>
        <h1 class="mc-h1 mb-2">Asignaciones de alumnos</h1>
        <p class="text-muted mb-0">
            Vista general de los alumnos bajo tu seguimiento para futuras acciones de reasignación o control.
        </p>
    </header>

    <section th:if="${alumnos == null or #lists.isEmpty(alumnos)}" class="card">
        <div class="card-body">
            <p class="mb-0 text-muted">No hay alumnos disponibles para gestión de asignaciones.</p>
        </div>
    </section>

    <section th:if="${alumnos != null and !#lists.isEmpty(alumnos)}" aria-labelledby="listado-asignaciones">
        <h2 id="listado-asignaciones" class="visually-hidden">Listado de alumnos para asignaciones</h2>

        <div class="row g-4">
            <div class="col-12 col-lg-6" th:each="alumno : ${alumnos}">
                <article class="card h-100">
                    <div class="card-body">
                        <h3 class="h5 mb-2" th:text="${alumno.nombreCompleto}">Alumno</h3>
                        <p class="text-muted mb-3">
                            Usuario: <span th:text="${alumno.nombreUsuario}">usuario</span>
                            · Grupo: <span th:text="${alumno.grupo != null ? alumno.grupo : '—'}">—</span>
                        </p>

                        <a th:href="@{/tutor-centro/alumnos/{id}(id=${alumno.id})}" class="btn btn-mc-primary">
                            <i class="fas fa-arrow-right me-2" aria-hidden="true"></i>
                            Ver expediente
                        </a>
                    </div>
                </article>
            </div>
        </div>
    </section>
</section>
</html>
