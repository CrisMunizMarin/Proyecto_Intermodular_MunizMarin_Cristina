<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
        'Alumnos Tutor Centro',
        ~{layout/sidebar-tutor-centro :: sidebar},
        ~{::contenido},
        null,
        null
      )}">
<section th:fragment="contenido">
    <header class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
        <div>
            <p class="mc-caption text-uppercase fw-bold mb-2" style="color: var(--mc-indigo); letter-spacing: 0.08em;">
                Seguimiento de alumnos
            </p>
            <h1 class="mc-h1 mb-2">Alumnos asignados</h1>
            <p class="text-muted mb-0">
                Consulta tu grupo de alumnos y accede a su detalle de seguimiento.
            </p>
        </div>

        <a th:href="@{/tutor-centro/busqueda-alumno}" class="btn btn-mc-tertiary">
            <i class="fas fa-magnifying-glass me-2" aria-hidden="true"></i>
            Vista de búsqueda
        </a>
    </header>

    <section th:if="${alumnos == null or #lists.isEmpty(alumnos)}" class="card">
        <div class="card-body">
            <p class="mb-0 text-muted">No tienes alumnos asignados actualmente.</p>
        </div>
    </section>

    <section th:if="${alumnos != null and !#lists.isEmpty(alumnos)}" aria-labelledby="listado-alumnos">
        <h2 id="listado-alumnos" class="visually-hidden">Listado de alumnos</h2>

        <div class="row g-4">
            <div class="col-12 col-lg-6" th:each="alumno : ${alumnos}">
                <article class="card h-100">
                    <div class="card-body">
                        <header class="mb-3">
                            <h3 class="h5 mb-1" th:text="${alumno.nombreCompleto}">Alumno</h3>
                            <p class="text-muted mb-0">
                                Grupo:
                                <span th:text="${alumno.grupo != null ? alumno.grupo : '—'}">—</span>
                                · Usuario:
                                <span th:text="${alumno.nombreUsuario}">usuario</span>
                            </p>
                        </header>

                        <dl class="row mb-4">
                            <dt class="col-sm-5">Correo</dt>
                            <dd class="col-sm-7" th:text="${alumno.email}">mail@example.com</dd>

                            <dt class="col-sm-5">Horas completadas</dt>
                            <dd class="col-sm-7">
                                <span th:text="${alumno.horasCompletadas}">0</span>
                                /
                                <span th:text="${alumno.horasTotalesFe}">400</span>
                            </dd>

                            <dt class="col-sm-5">DNI</dt>
                            <dd class="col-sm-7" th:text="${alumno.dni != null ? alumno.dni : '—'}">—</dd>
                        </dl>

                        <a th:href="@{/tutor-centro/alumnos/{id}(id=${alumno.id})}" class="btn btn-mc-primary">
                            <i class="fas fa-eye me-2" aria-hidden="true"></i>
                            Ver detalle
                        </a>
                    </div>
                </article>
            </div>
        </div>
    </section>
</section>
</html>
