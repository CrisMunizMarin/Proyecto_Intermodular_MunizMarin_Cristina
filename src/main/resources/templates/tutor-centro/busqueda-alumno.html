<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
        'Búsqueda de Alumnos',
        ~{layout/sidebar-tutor-centro :: sidebar},
        ~{::contenido},
        null,
        null
      )}">
<section th:fragment="contenido">
    <header class="mb-4">
        <p class="mc-caption text-uppercase fw-bold mb-2" style="color: var(--mc-indigo); letter-spacing: 0.08em;">
            Acceso rápido
        </p>
        <h1 class="mc-h1 mb-2">Búsqueda de alumnos</h1>
        <p class="text-muted mb-0">
            Filtra visualmente por nombre o usuario desde tu navegador para localizar más rápido a un alumno.
        </p>
    </header>

    <section class="card mb-4" aria-labelledby="filtro-alumnos">
        <div class="card-body">
            <label for="filtroAlumno" class="form-label" id="filtro-alumnos">Buscar alumno</label>
            <input type="search"
                   id="filtroAlumno"
                   class="form-control"
                   placeholder="Escribe nombre, apellidos o usuario"
                   oninput="filtrarAlumnosTutorCentro()">
        </div>
    </section>

    <section aria-labelledby="resultados-alumnos">
        <h2 id="resultados-alumnos" class="visually-hidden">Resultados de alumnos</h2>

        <div class="row g-4" id="listaAlumnosTutorCentro">
            <div class="col-12 col-lg-6 alumno-item" th:each="alumno : ${alumnos}"
                 th:attr="data-search=${#strings.toLowerCase(alumno.nombreCompleto + ' ' + alumno.nombreUsuario)}">
                <article class="card h-100">
                    <div class="card-body">
                        <h3 class="h5 mb-2" th:text="${alumno.nombreCompleto}">Alumno</h3>
                        <p class="text-muted mb-3">
                            Usuario: <span th:text="${alumno.nombreUsuario}">usuario</span>
                            · Grupo: <span th:text="${alumno.grupo != null ? alumno.grupo : '—'}">—</span>
                        </p>
                        <a th:href="@{/tutor-centro/alumnos/{id}(id=${alumno.id})}" class="btn btn-mc-primary">
                            <i class="fas fa-arrow-right me-2" aria-hidden="true"></i>
                            Abrir detalle
                        </a>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <script th:inline="javascript">
        function filtrarAlumnosTutorCentro() {
            const filtro = document.getElementById('filtroAlumno').value.toLowerCase().trim();
            const items = document.querySelectorAll('#listaAlumnosTutorCentro .alumno-item');

            items.forEach(item => {
                const texto = item.dataset.search || '';
                item.style.display = texto.includes(filtro) ? '' : 'none';
            });
        }
    </script>
</section>
</html>
