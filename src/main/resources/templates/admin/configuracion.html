<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
        'Configuración Administrador',
        ~{layout/sidebar-admin :: sidebar},
        ~{::contenido},
        null,
        null
      )}">
<section th:fragment="contenido">
    <header class="mb-4">
        <p class="mc-caption text-uppercase fw-bold mb-2" style="color: var(--mc-indigo); letter-spacing: 0.08em;">Configuración global</p>
        <h1 class="mc-h1 mb-2">Parámetros del sistema</h1>
        <p class="text-muted mb-0">Ajusta valores globales sin tocar código ni base de datos manualmente.</p>
    </header>

    <section th:if="${successMsg}" class="alert alert-success"><p class="mb-0" th:text="${successMsg}">OK</p></section>
    <section th:if="${errorMsg}" class="alert alert-danger"><p class="mb-0" th:text="${errorMsg}">Error</p></section>

    <div class="row g-4" th:if="${parametros != null and !#lists.isEmpty(parametros)}">
        <div class="col-12" th:each="parametro : ${parametros}">
            <article class="card">
                <div class="card-body">
                    <form th:action="@{/admin/configuracion/actualizar/{id}(id=${parametro.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-3">
                            <div class="mc-min-w-0">
                                <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                                    <h2 class="h6 mb-0" th:text="${parametro.clave}">clave</h2>
                                    <span class="badge bg-light text-dark border"
                                          th:text="${parametro.tipoDato != null ? parametro.tipoDato : 'texto'}">
                                        texto
                                    </span>
                                </div>
                                <p class="small text-muted mb-0"
                                   th:text="${parametro.descripcion != null ? parametro.descripcion : 'Sin descripción adicional.'}">
                                    Descripción
                                </p>
                            </div>
                            <div class="text-lg-end small text-muted">
                                <span>ID </span><span th:text="${parametro.id}">1</span>
                            </div>
                        </div>

                        <div class="row g-3 align-items-end">
                            <div class="col-12">
                                <label class="form-label">Valor</label>
                                <textarea name="valor" rows="2" class="form-control" th:text="${parametro.valor}">valor</textarea>
                            </div>
                            <div class="col-12 d-flex justify-content-end">
                                <button type="submit" class="btn btn-mc-primary">Guardar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </article>
        </div>
    </div>

    <section th:if="${parametros == null or #lists.isEmpty(parametros)}" class="card">
        <div class="card-body"><p class="mb-0 text-muted">No hay parámetros configurables en este momento.</p></div>
    </section>
</section>
</html>
