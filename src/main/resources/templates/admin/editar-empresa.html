<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
        'Editar Empresa',
        ~{layout/sidebar-admin :: sidebar},
        ~{::contenido},
        null,
        null
      )}">
<section th:fragment="contenido">
    <header class="mb-4">
        <p class="mc-caption text-uppercase fw-bold mb-2" style="color: var(--mc-indigo); letter-spacing: 0.08em;">Edición de empresa</p>
        <h1 class="mc-h1 mb-2">Actualizar empresa</h1>
    </header>

    <section th:if="${errorMsg}" class="alert alert-danger"><p class="mb-0" th:text="${errorMsg}">Error</p></section>

    <form th:action="@{/admin/empresas/editar/{id}(id=${empresa.id})}" th:object="${empresa}" method="post" class="card">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-lg-6"><label class="form-label">Nombre</label><input th:field="*{nombre}" class="form-control" required></div>
                <div class="col-12 col-lg-3"><label class="form-label">CIF</label><input th:field="*{cif}" class="form-control" required></div>
                <div class="col-12 col-lg-3"><label class="form-label">Sector</label><input th:field="*{sector}" class="form-control"></div>
                <div class="col-12 col-lg-6"><label class="form-label">Dirección</label><input th:field="*{direccion}" class="form-control"></div>
                <div class="col-12 col-lg-3"><label class="form-label">Municipio</label><input th:field="*{municipio}" class="form-control"></div>
                <div class="col-12 col-lg-3"><label class="form-label">Provincia</label><input th:field="*{provincia}" class="form-control"></div>
                <div class="col-12 col-lg-3"><label class="form-label">Código postal</label><input th:field="*{codigoPostal}" class="form-control"></div>
                <div class="col-12 col-lg-3"><label class="form-label">Teléfono</label><input th:field="*{telefono}" class="form-control"></div>
                <div class="col-12 col-lg-6"><label class="form-label">Email contacto</label><input th:field="*{emailContacto}" class="form-control"></div>
                <div class="col-12"><label class="form-label">Web</label><input th:field="*{web}" class="form-control"></div>
                <div class="col-12"><label class="form-label">Notas</label><textarea th:field="*{notas}" rows="4" class="form-control"></textarea></div>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between gap-3 flex-wrap">
            <a th:href="@{/admin/empresas}" class="btn btn-outline-secondary">Volver</a>
            <button type="submit" class="btn btn-mc-primary">Guardar cambios</button>
        </div>
    </form>
</section>
</html>
