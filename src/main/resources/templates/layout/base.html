<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(titulo, sidebar, contenido, cssExtra, jsExtra)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

    <title th:text="${titulo != null ? titulo + ' | MentorCore' : 'MentorCore'}">MentorCore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/mentorcore.css}" rel="stylesheet">

    
</head>
<body>
<a class="visually-hidden-focusable position-absolute top-0 start-0 m-3 p-2 bg-white border rounded"
   href="#contenido-principal">
    Saltar al contenido principal
</a>

<header class="mc-shell__header">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #432AA5;" aria-label="Navegación principal">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <img th:src="@{/img/MentorCore_circular.png}"
                     src="/img/MentorCore_circular.png"
                     alt="Logotipo de MentorCore"
                     style="width: 2.5rem; height: 2.5rem;">
                <span>MentorCore</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <p class="mb-0 text-white" aria-label="Usuario autenticado">
                    <i class="fas fa-user-circle me-1" aria-hidden="true"></i>
                    <span sec:authentication="name">usuario</span>
                </p>

                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt me-1" aria-hidden="true"></i>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<div class="container-fluid">
    <div class="row flex-nowrap">
        <aside class="col-12 col-md-3 col-xl-2 sidebar p-0"
               sec:authorize="isAuthenticated()"
               aria-label="Menú lateral">
            <th:block th:if="${sidebar != null}" th:replace="${sidebar}"></th:block>
        </aside>

        <main id="contenido-principal"
              class="col-12 col-md-9 col-xl-10 p-4"
              sec:authorize="isAuthenticated()">
            <th:block th:replace="${contenido}"></th:block>
        </main>

        <main id="contenido-principal-publico"
              class="col-12 p-4"
              sec:authorize="!isAuthenticated()">
            <th:block th:replace="${contenido}"></th:block>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>


</body>
</html>
